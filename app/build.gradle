plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.herrderb.launcherli'
    compileSdk 36

    defaultConfig {
        applicationId "com.herrderb.launcherli"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            resValue "string", "app_name", "Launcherli Launcher"
        }
        debug {
            // Separate app id + name so the dev build installs alongside prod.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "Launcherli Debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        resValues true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.05.01')
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.10.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'com.posthog:posthog-android:3.+'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

tasks.register('deploy', Exec) {
    description = 'Build debug APK, install on connected device, and launch the app'
    group = 'development'
    dependsOn 'installDebug'
    def sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT") ?: "${System.getProperty('user.home')}/AppData/Local/Android/Sdk"
    def adb = "${sdkDir}/platform-tools/adb"
    // Debug build carries the ".debug" applicationId suffix; the activity class
    // itself stays in the com.herrderb.launcherli package.
    commandLine adb, 'shell', 'am', 'start', '-n',
        'com.herrderb.launcherli.debug/com.herrderb.launcherli.MainActivity',
        '-a', 'android.intent.action.MAIN',
        '-c', 'android.intent.category.HOME'
}
